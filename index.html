<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jihad Amerafgan Agae Agni — Portfolio</title>
  <meta name="description" content="Portfolio & Biodata Jihad Amerafgan Agae Agni — Web Developer, Data Analyst, dan Drone Pilot dari Indonesia.">
  <meta name="keywords" content="portfolio, web developer, data analyst, drone pilot, jihad amerafgan">
  <meta name="author" content="Jihad Amerafgan Agae Agni">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Noise Overlay -->
  <div class="noise-overlay"></div>

  <!-- ===================== SPLASH SCREEN ===================== -->
  <div id="splash-screen">
    <div style="text-align:center">
      <div class="splash-spinner"></div>
      <p class="splash-label">Portfolio Loading</p>
      <h1 class="splash-name" id="splash-name"></h1>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    </div>
  </div>

  <!-- ===================== HEADER ===================== -->
  <header id="main-header">
    <div class="header-inner">
      <div class="header-content">
        <a href="#home" class="header-brand"><img src="assets/logo.png" alt="Logo" class="brand-logo"></a>
        <div class="header-actions">
          <!-- Theme Toggle -->
          <button id="theme-toggle" class="header-btn" aria-label="Toggle theme">
            <!-- Sun icon (shown in dark mode) -->
            <span class="icon theme-icon-sun" id="icon-sun">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            </span>
            <!-- Moon icon (shown in light mode) -->
            <span class="icon theme-icon-moon" id="icon-moon" style="display:none">
              <svg viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </span>
          </button>
          <!-- Hamburger -->
          <button id="hamburger-btn" class="header-btn" aria-label="Menu">
            <div class="hamburger-lines">
              <span class="hamburger-line"></span>
              <span class="hamburger-line"></span>
              <span class="hamburger-line"></span>
            </div>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Nav Overlay -->
  <div id="nav-overlay" class="nav-overlay"></div>

  <!-- Nav Drawer -->
  <nav id="nav-drawer" class="nav-drawer">
    <div class="nav-drawer-header">
      <span class="nav-drawer-title">Menu</span>
      <button id="nav-close" class="nav-close-btn" aria-label="Close menu">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
      </button>
    </div>
    <ul class="nav-links" id="nav-links-list">
      <!-- Data injected via script.js -->
    </ul>
    <div class="nav-footer" id="nav-footer-copy"></div>
  </nav>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main id="main-content">

    <!-- ========== HERO ========== -->
    <section id="home" class="hero">
      <div class="hero-container">
        <!-- Avatar -->
        <div class="avatar-wrap">
          <div class="avatar-ring">
            <div class="avatar-img-wrap">
              <img id="hero-img" alt="Avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
              <div class="avatar-fallback" id="hero-fallback" style="display:none"></div>
            </div>
          </div>
        </div>

        <!-- Status -->
        <div class="status-badge" style="display: none;">
          <span class="status-dot"></span>
          <span class="status-text" id="hero-status"></span>
        </div>

        <!-- Text -->
        <p class="hero-greeting" id="hero-greeting"></p>
        <h1 class="hero-name" id="hero-name"></h1>
        <p class="hero-role" id="hero-role"></p>

        <!-- CTA -->
        <div class="cta-wrap">
          <a href="#about" class="btn btn-primary">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7v10H7"/></svg></span>
            Who Am I
          </a>
        </div>

        <!-- Social -->
        <div class="social-icons" id="hero-social">
          <!-- Data injected via script.js -->
        </div>

        <!-- Scroll -->
        <div class="scroll-indicator">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></svg></span>
        </div>
      </div>
    </section>

    <!-- ========== ABOUT ========== -->
    <section id="about" class="section">
      <div class="section-container reveal">
        <div class="section-header">
          <p class="section-label">About</p>
          <h2 class="section-title">Who Am I</h2>
          <div class="section-divider"></div>
        </div>

        <div class="about-bio" id="about-bio">
          <!-- Data injected via script.js -->
        </div>

        <!-- Approach Card -->
        <div class="glass-card approach-card">
          <div class="card-title">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4M19 17v4M3 5h4M17 19h4"/></svg></span>
            My Approach
          </div>
          <div class="approach-grid" id="approach-grid">
            <!-- Data injected via script.js -->
          </div>
        </div>

        <!-- Details Card -->
        <div class="glass-card details-card">
          <div class="card-title">
            <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 1 0-16 0"/></svg></span>
            Personal Details
          </div>
          <div class="detail-row">
            <span class="detail-label">Name</span>
            <span class="detail-value" id="detail-name"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Location</span>
            <span class="detail-value detail-value-row">
              <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
              <span id="detail-location"></span>
            </span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Education</span>
            <span class="detail-value" id="detail-education"></span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Interests</span>
            <div class="interest-tags" id="detail-interests">
              <!-- Data injected via script.js -->
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ========== SKILLS ========== -->
    <section id="skills" class="section">
      <div class="section-container reveal">
        <div class="section-header">
          <p class="section-label">Expertise</p>
          <h2 class="section-title">Skills</h2>
          <div class="section-divider"></div>
        </div>

        <div class="skills-grid" id="skills-grid">
          <!-- Data injected via script.js -->
        </div>
      </div>
    </section>

    <!-- ========== EXPERIENCE ========== -->
    <section id="experience" class="section">
      <div class="section-container reveal">
        <div class="section-header">
          <p class="section-label">Journey</p>
          <h2 class="section-title">Work Experience</h2>
          <div class="section-divider"></div>
        </div>

        <div class="timeline" id="experience-timeline">
          <!-- Data injected via script.js -->
        </div>
      </div>
    </section>

    <!-- ========== CONTACT ========== -->
    <section id="contact" class="section">
      <div class="section-container reveal">
        <div class="section-header">
          <p class="section-label">Get In Touch</p>
          <h2 class="section-title" id="contact-heading"></h2>
          <div class="section-divider"></div>
          <p class="section-desc" id="contact-desc"></p>
        </div>

        <div class="contact-cards">
          <div class="glass-card contact-card">
            <div class="contact-card-icon">
              <span class="icon"><svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span>
            </div>
            <div>
              <p class="contact-card-label">Email</p>
              <p class="contact-card-value" id="contact-email-val"></p>
            </div>
          </div>
          <div class="glass-card contact-card">
            <div class="contact-card-icon">
              <span class="icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></span>
            </div>
            <div>
              <p class="contact-card-label">Location</p>
              <p class="contact-card-value" id="contact-loc-val"></p>
            </div>
          </div>
        </div>

        <form id="contact-form" class="glass-card contact-form">
          <div class="form-group">
            <label for="c-name" class="form-label">Name</label>
            <input type="text" id="c-name" class="form-input" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="c-email" class="form-label">Email</label>
            <input type="email" id="c-email" class="form-input" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="c-msg" class="form-label">Message</label>
            <textarea id="c-msg" class="form-textarea" placeholder="Write your message..." required></textarea>
          </div>
          <button type="submit" id="form-submit-btn" class="form-submit">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span>
            Send Message
          </button>
          <div id="form-success" class="form-success">
            <span class="icon"><svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg></span>
            Pesan terkirim! Terima kasih.
          </div>
        </form>
      </div>
    </section>

    <!-- ========== FOOTER ========== -->
    <footer class="footer">
      <div class="footer-brand-wrap">
        <img src="assets/logo.png" alt="Logo" class="brand-logo footer-logo">
      </div>
      <div class="footer-socials" id="footer-social">
        <!-- Data injected via script.js -->
      </div>
      <p class="footer-copy" id="footer-copy"></p>
      <p class="footer-sub" id="footer-tagline"></p>
    </footer>

  </main>

  <!-- ===================== AI CHAT WIDGET ===================== -->
  <!-- FAB -->
  <button id="chat-fab" class="chat-fab" aria-label="Open AI Assistant">
    <span class="icon"><svg viewBox="0 0 24 24"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg></span>
    <span id="chat-notif" class="chat-fab-notif"></span>
  </button>

  <!-- Chat Widget -->
  <div id="chat-widget" class="chat-widget">
    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-header-avatar">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2M20 14h2M15 13v2M9 13v2"/></svg></span>
        </div>
        <div>
          <div class="chat-header-name" id="chat-bot-name"></div>
          <div class="chat-header-status">
            <span class="chat-header-status-dot"></span>
            <span class="chat-header-status-text">Online</span>
          </div>
        </div>
      </div>
      <button id="chat-close" class="chat-close-btn" aria-label="Close chat">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></span>
      </button>
    </div>
    <div id="chat-messages" class="chat-messages"></div>
    <div class="chat-quick-replies" id="chat-quick-replies">
      <!-- Data injected via script.js -->
    </div>
    <div class="chat-input-wrap">
      <input type="text" id="chat-input" class="chat-input" placeholder="Ketik pesan...">
      <button id="chat-send" class="chat-send-btn" aria-label="Send">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span>
      </button>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
